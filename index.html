<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sora | ClickGUI</title>
  <link rel="manifest" href="data:application/json,{
    &quot;name&quot;: &quot;Sora ClickGUI&quot;,
    &quot;short_name&quot;: &quot;Sora&quot;,
    &quot;start_url&quot;: &quot;.&quot;,
    &quot;display&quot;: &quot;standalone&quot;,
    &quot;background_color&quot;: &quot;#0a0608&quot;,
    &quot;theme_color&quot;: &quot;#ff66aa&quot;,
    &quot;icons&quot;: []
  }">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
    }

    :root {
      --primary: #ff66aa;
      --primary-glow: #ff3388;
      --border: rgba(255, 100, 180, 0.45);
      --accent: #ff4d94;
      --blur-amount: 24px;
      --panel-opacity: 0.92;
      --gui-scale: 0.85;
    }

    body {
      background: #0a0608;
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      margin: 0;
      padding: 6px;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
    }

    .clickgui {
      width: 100%;
      max-width: 620px;
      height: auto;
      max-height: 85vh;
      background: rgba(18, 10, 20, var(--panel-opacity));
      backdrop-filter: blur(var(--blur-amount));
      -webkit-backdrop-filter: blur(var(--blur-amount));
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 30px var(--primary-glow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: scale(var(--gui-scale));
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
      position: relative;
    }

    .clickgui.gui-hidden {
      transform: scale(0.3);
      opacity: 0;
      pointer-events: none;
    }

    .hud-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 997;
      display: flex;
      flex-direction: column;
      gap: 2px;
      pointer-events: none;
      max-height: 60vh;
      overflow: hidden;
    }

    .hud-item {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-align: right;
      white-space: nowrap;
      animation: hudSlideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      color: var(--primary);
      text-shadow: 0 0 8px var(--primary-glow), 0 1px 3px rgba(0,0,0,0.8);
    }

    .hud-item.hud-removing {
      animation: hudSlideOut 0.25s ease forwards;
    }

    @keyframes hudSlideIn {
      from { opacity: 0; transform: translateX(20px) scale(0.9); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }

    @keyframes hudSlideOut {
      from { opacity: 1; transform: translateX(0) scale(1); }
      to { opacity: 0; transform: translateX(20px) scale(0.9); }
    }

    .minimized-btn {
      position: fixed;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary);
      border: 2px solid #ffb3d9;
      box-shadow: 0 0 25px var(--accent);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 999;
      font-size: 22px;
      color: white;
      user-select: none;
      touch-action: none;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
      transform: scale(0);
      opacity: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .minimized-btn.show { display: flex; transform: scale(1); opacity: 1; }
    .minimized-btn:active { cursor: grabbing; }

    .title-bar {
      background: linear-gradient(180deg, rgba(22, 10, 18, 0.96), rgba(14, 6, 16, 1));
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      flex-shrink: 0;
    }

    .logo { display: flex; align-items: center; gap: 6px; }
    .logo-icon { font-size: 20px; }
    .logo-text {
      font-size: 1.3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffb3d9, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .window-controls { display: flex; gap: 8px; }
    .win-btn {
      width: 12px; height: 12px; border-radius: 50%;
      cursor: pointer; transition: transform 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .win-btn:hover { transform: scale(1.3); }
    .win-btn.close { background: #ff5f57; }
    .win-btn.minimize { background: #febc2e; }

    .main-layout { display: flex; flex: 1; overflow: hidden; min-height: 0; }

    .category-panel {
      width: 110px; min-width: 90px; background: rgba(12, 6, 14, 0.85);
      border-right: 1px solid var(--border); padding: 8px 4px;
      display: flex; flex-direction: column; gap: 3px;
      overflow-y: auto; flex-shrink: 0; max-height: 100%;
    }

    .category-item {
      padding: 8px 8px; border-radius: 10px; color: #b8909e;
      font-weight: 600; font-size: 0.7rem; display: flex; align-items: center;
      gap: 5px; cursor: pointer; border: 1px solid transparent;
      text-transform: uppercase; letter-spacing: 0.3px;
      transition: all 0.2s ease; white-space: nowrap;
    }
    .category-item i { font-style: normal; font-size: 0.85rem; }
    .category-item.active {
      background: rgba(255, 102, 170, 0.25); border-color: var(--primary);
      color: white; box-shadow: 0 0 10px rgba(255, 102, 170, 0.3);
    }

    .modules-panel { flex: 1; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; min-height: 0; }
    .category-title {
      font-size: 0.85rem; font-weight: 700; color: #ffccdd;
      border-left: 3px solid var(--primary); padding-left: 10px;
      text-transform: uppercase; flex-shrink: 0; animation: fadeSlide 0.3s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .module-scroll {
      flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0;
      -webkit-overflow-scrolling: touch; max-height: calc(4 * (38px + 5px));
    }

    .module-grid { display: flex; flex-direction: column; gap: 5px; padding-bottom: 4px; }

    .module-card {
      background: rgba(22, 10, 18, 0.85); border: 1px solid rgba(255, 102, 170, 0.2);
      border-radius: 10px; padding: 9px 14px; display: flex; align-items: center;
      justify-content: space-between; transition: all 0.25s ease; cursor: pointer;
      flex-shrink: 0; animation: fadeSlide 0.3s ease; min-height: 38px;
    }
    .module-card.expanded {
      border-radius: 10px 10px 0 0; border-bottom: none;
      border-color: var(--primary); box-shadow: 0 0 15px rgba(255, 102, 170, 0.3);
    }

    .module-info { flex: 1; min-width: 0; }
    .module-name { font-weight: 700; font-size: 0.8rem; color: #ffe5f0; }
    .module-desc { font-size: 0.65rem; color: #b8909e; margin-top: 1px; }

    .toggle-switch { position: relative; width: 34px; height: 20px; flex-shrink: 0; margin-left: 8px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background: #2a1a26; border-radius: 20px; border: 1px solid #5a3a4a; transition: 0.25s ease;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px;
      background: #7a5a6a; border-radius: 50%; transition: 0.25s ease;
    }
    input:checked + .slider { background: var(--primary); border-color: #ff80b0; box-shadow: 0 0 12px var(--accent); }
    input:checked + .slider:before { transform: translateX(14px); background: white; }

    .module-config-inline {
      display: none; padding: 8px 14px 10px; background: rgba(14, 6, 16, 0.9);
      border: 1px solid var(--primary); border-top: none; border-radius: 0 0 10px 10px;
      flex-direction: column; gap: 6px; flex-shrink: 0;
      animation: fadeSlide 0.25s ease; box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }
    .module-card.expanded + .module-config-inline { display: flex; }

    .config-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .config-row label { font-size: 0.65rem; min-width: 45px; font-weight: 600; color: #ffccdd; }
    .config-row input[type="range"] { flex: 1; min-width: 50px; accent-color: var(--primary); height: 12px; }
    .config-row span { min-width: 28px; text-align: right; font-size: 0.65rem; color: #ffd9e6; }

    .mode-selector { display: flex; gap: 3px; flex-wrap: wrap; }
    .mode-option {
      padding: 2px 8px; border-radius: 8px; border: 1px solid rgba(255, 102, 170, 0.5);
      background: transparent; color: #c9a0b5; font-size: 0.6rem;
      cursor: pointer; font-weight: 600; transition: all 0.2s ease;
    }
    .mode-option.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 0 10px var(--accent); }

    .color-options { display: flex; gap: 4px; flex-wrap: wrap; }
    .color-dot {
      width: 20px; height: 20px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: all 0.2s ease;
    }
    .color-dot:hover { transform: scale(1.2); }
    .color-dot.active { border-color: white; box-shadow: 0 0 12px currentColor; }

    .notification {
      position: fixed; bottom: 80px; right: 20px;
      background: rgba(20, 10, 24, 0.95); border: 1px solid var(--primary);
      border-radius: 12px; padding: 10px 16px; color: #ffccdd;
      font-size: 0.75rem; font-weight: 600;
      box-shadow: 0 8px 25px rgba(0,0,0,0.7), 0 0 20px var(--accent);
      z-index: 1000; opacity: 0; transform: translateX(120%);
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none; display: flex; align-items: center; gap: 8px; max-width: 250px;
    }
    .notification.show { opacity: 1; transform: translateX(0); }

    @media (max-width: 380px) {
      .clickgui { max-height: 90vh; border-radius: 10px; }
      .category-panel { width: 80px; min-width: 70px; }
      .category-item { font-size: 0.6rem; padding: 6px 5px; }
    }
  </style>
</head>
<body>
<div class="hud-panel" id="hudPanel"></div>
<div class="clickgui" id="mainGui">
  <div class="title-bar" id="titleBar">
    <div class="logo"><span class="logo-icon">🌸</span><span class="logo-text">SORA</span></div>
    <div class="window-controls">
      <div class="win-btn minimize" id="minimizeBtn"></div>
      <div class="win-btn close" id="closeBtn"></div>
    </div>
  </div>
  <div class="main-layout">
    <div class="category-panel" id="categoryPanel"></div>
    <div class="modules-panel" id="modulesContainer">
      <div class="category-title" id="currentCategoryTitle">COMBAT</div>
      <div class="module-scroll" id="moduleScroll">
        <div class="module-grid" id="moduleGrid"></div>
      </div>
    </div>
  </div>
</div>

<div class="minimized-btn" id="minimizedBtn">🌸</div>
<div class="notification" id="notification"><span id="notificationText"></span></div>

<script>
  (function() {
    let audioCtx = null;
    let notificationsEnabled = true;
    let hudEnabled = true;

    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function playToggleSound() {
      if (!notificationsEnabled) return;
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(500, now);
        osc.frequency.exponentialRampToValueAtTime(700, now + 0.06);
        osc.frequency.exponentialRampToValueAtTime(500, now + 0.12);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.15);
      } catch(e) {}
    }

    function showNotification(text) {
      if (!notificationsEnabled) return;
      const notif = document.getElementById('notification');
      const notifText = document.getElementById('notificationText');
      notifText.textContent = text;
      notif.classList.add('show');
      clearTimeout(notif._timeout);
      notif._timeout = setTimeout(() => notif.classList.remove('show'), 1500);
    }

    const hudPanel = document.getElementById('hudPanel');

    function updateHUD() {
      hudPanel.innerHTML = '';
      if (!hudEnabled) return;
      
      const allMods = [];
      Object.keys(modulesData).forEach(cat => {
        if (cat === 'client') return;
        modulesData[cat].forEach(mod => {
          if (mod.enabled) allMods.push(mod);
        });
      });
      
      // 按名称长度从长到短排序
      allMods.sort((a, b) => b.name.length - a.name.length);
      
      // 直接重建整个HUD
      allMods.forEach(mod => {
        const el = document.createElement('div');
        el.className = 'hud-item';
        el.textContent = mod.name;
        hudPanel.appendChild(el);
      });
    }

    const fontMap = {
      'Default': "'Segoe UI', 'Poppins', system-ui, sans-serif",
      'Minecraft': "'Courier New', monospace",
      'Smooth': "'Inter', 'Helvetica Neue', sans-serif"
    };
    function applyFont(fontName) { document.body.style.fontFamily = fontMap[fontName] || fontMap['Default']; }

    const modulesData = {
      combat: [
        { name:"KillAura", desc:"自动攻击", enabled:true, config:{range:4.2, cps:12, mode:["Normal","Packet","Legit"], modeVal:"Normal"} },
        { name:"Velocity", desc:"减少击退", enabled:false, config:{h:0, v:0, mode:["Simple","Hypixel","AAC"], modeVal:"Simple"} },
        { name:"Criticals", desc:"暴击", enabled:true, config:{mode:["Packet","Jump","Mini"], modeVal:"Packet", chance:100} },
        { name:"Reach", desc:"攻击距离", enabled:false, config:{dist:3.8, blockReach:4.5} },
        { name:"AutoBlock", desc:"自动格挡", enabled:false, config:{mode:["Hypixel","Vanilla","Intave"], modeVal:"Hypixel", delay:80} },
        { name:"WTap", desc:"自动WTap", enabled:false, config:{delay:150, range:2.8} },
        { name:"Hitboxes", desc:"扩大碰撞箱", enabled:false, config:{expand:0.4, onlyMoving:true} },
        { name:"AutoPot", desc:"自动药水", enabled:true, config:{health:14, delay:120} },
        { name:"TriggerBot", desc:"自动点击", enabled:false, config:{cps:14, randomize:true} },
        { name:"BackTrack", desc:"延迟回溯", enabled:false, config:{delay:150, maxRange:5} },
        { name:"AutoWeapon", desc:"自动武器", enabled:true, config:{preferSword:true} },
        { name:"SilentAim", desc:"静默瞄准", enabled:false, config:{fov:60, smooth:3} }
      ],
      movement: [
        { name:"Flight", desc:"飞行", enabled:true, config:{speed:1.8, mode:["Vanilla","Packet","Hypixel"], modeVal:"Vanilla", antiKick:true} },
        { name:"Speed", desc:"速度", enabled:false, config:{mode:["Hypixel","Vanilla","NCP"], modeVal:"Hypixel", multiplier:1.4} },
        { name:"NoFall", desc:"无摔伤", enabled:true, config:{mode:["Packet","AAC","Verus"], modeVal:"Packet", minFallDist:3} },
        { name:"Step", desc:"自动上坡", enabled:false, config:{height:2, mode:["Vanilla","NCP","AAC"], modeVal:"Vanilla"} },
        { name:"Jesus", desc:"水上行走", enabled:false, config:{mode:["Solid","Dolphin","Jump"], modeVal:"Solid", speed:1.0} },
        { name:"Spider", desc:"爬墙", enabled:false, config:{mode:["Simple","Advanced"], modeVal:"Simple", speed:0.8} },
        { name:"LongJump", desc:"远跳", enabled:false, config:{boost:2.3, mode:["Hypixel","Vanilla"], modeVal:"Hypixel"} },
        { name:"InvMove", desc:"背包移动", enabled:true, config:{allowSprint:true} },
        { name:"Scaffold", desc:"自动搭路", enabled:false, config:{delay:60, mode:["Normal","Sprint"], modeVal:"Normal"} },
        { name:"NoSlow", desc:"无减速", enabled:true, config:{items:true, soulsand:true} },
        { name:"Blink", desc:"瞬移", enabled:false, config:{delay:200, maxPackets:50} },
        { name:"Freecam", desc:"自由视角", enabled:false, config:{speed:2, clip:true} }
      ],
      player: [
        { name:"AutoArmor", desc:"自动盔甲", enabled:true, config:{delay:80, dropOld:true} },
        { name:"ChestStealer", desc:"快速取箱", enabled:false, config:{delay:45, autoClose:true} },
        { name:"FastPlace", desc:"快速放置", enabled:false, config:{speed:2, blocksOnly:true} },
        { name:"AutoTool", desc:"自动工具", enabled:true, config:{switchBack:true} },
        { name:"InvCleaner", desc:"清理背包", enabled:false, config:{delay:500, keepTools:true} },
        { name:"AutoEat", desc:"自动进食", enabled:true, config:{hunger:16, priority:["GApple","Steak"], priorityVal:"GApple"} },
        { name:"AutoFish", desc:"自动钓鱼", enabled:false, config:{delay:300, autoRecast:true} },
        { name:"ScaffoldWalk", desc:"潜行搭路", enabled:false, config:{edgeSneak:true} },
        { name:"FastBreak", desc:"快速破坏", enabled:false, config:{speed:1.5, nuker:false} },
        { name:"AutoMLG", desc:"自动落地水", enabled:false, config:{minFall:5, water:true} }
      ],
      visual: [
        { name:"ESP", desc:"玩家透视", enabled:true, config:{mode:["Box","Outline","Shader"], modeVal:"Box", color:"#ff66aa"} },
        { name:"Fullbright", desc:"全局亮度", enabled:true, config:{gamma:15} },
        { name:"XRay", desc:"透视矿物", enabled:false, config:{ores:[1,14,15,56,129], depth:64} },
        { name:"Nametags", desc:"名牌增强", enabled:true, config:{scale:1.3, background:true} },
        { name:"Chams", desc:"墙壁透视", enabled:false, config:{mode:["Colored","Textured","Wireframe"], modeVal:"Colored", opacity:0.8} },
        { name:"Tracers", desc:"追踪线", enabled:true, config:{width:1.5, color:"#ff3388"} },
        { name:"ESP2D", desc:"2D方框", enabled:false, config:{thickness:1.2} },
        { name:"StorageESP", desc:"箱子透视", enabled:true, config:{mode:["Box","Outline"], modeVal:"Box"} },
        { name:"ItemESP", desc:"物品透视", enabled:false, config:{maxDist:32} },
        { name:"NoHurtCam", desc:"无伤害抖动", enabled:true },
        { name:"ChinaHat", desc:"中国帽", enabled:false, config:{players:true, mobs:false} },
        { name:"Radar", desc:"雷达", enabled:false, config:{size:80, showPlayers:true} }
      ],
      misc: [
        { name:"AutoRespawn", desc:"自动重生", enabled:true, config:{delay:0} },
        { name:"AntiAFK", desc:"防挂机", enabled:false, config:{delay:2000, swingHand:true} },
        { name:"DiscordRPC", desc:"Sora状态", enabled:true, config:{showIP:false, showModule:true} },
        { name:"Spammer", desc:"自动消息", enabled:false, config:{delay:3000, randomOrder:true} },
        { name:"AutoGG", desc:"自动GG", enabled:true, config:{delay:500} },
        { name:"AutoLobby", desc:"自动大厅", enabled:false, config:{onDeath:true, onWin:true} },
        { name:"AntiBot", desc:"反假人", enabled:true, config:{mode:["Hypixel","Advanced"], modeVal:"Hypixel"} },
        { name:"Friends", desc:"好友系统", enabled:true, config:{maxFriends:50} },
        { name:"Keybinds", desc:"快捷键", enabled:true },
        { name:"Profiles", desc:"配置切换", enabled:true, config:{autoSave:true} }
      ],
      client: [
        { name:"AccentColor", desc:"强调色", enabled:true, config:{color:"#ff66aa"}, isColor:true },
        { name:"Theme", desc:"预设主题", enabled:true, config:{theme:["Pink","Blue","Purple","Green"], themeVal:"Pink"} },
        { name:"Blur", desc:"模糊强度", enabled:true, config:{blur:24} },
        { name:"Opacity", desc:"透明度", enabled:true, config:{opacity:92} },
        { name:"Scale", desc:"缩放", enabled:true, config:{scale:0.85} },
        { name:"Font", desc:"字体", enabled:true, config:{mode:["Default","Minecraft","Smooth"], modeVal:"Default"}, isFont:true },
        { name:"Notifications", desc:"通知", enabled:true, config:{toggle:true} },
        { name:"HUD", desc:"可视化功能", enabled:true, config:{toggle:true} }
      ]
    };

    const categoryNames = {
      combat: '⚔️ Combat', movement: '🏃 Move', player: '👤 Player',
      visual: '👁️ Visual', misc: '⚙️ Misc', client: '🖥️ Client'
    };

    const presetColors = ["#ff66aa","#00b4ff","#b266ff","#55dd88","#ff5555","#ffaa44","#44dddd","#dddddd"];
    const themeColors = {
      Pink: { primary:'#ff66aa', glow:'#ff3388', border:'rgba(255,100,180,0.45)' },
      Blue: { primary:'#00b4ff', glow:'#0066ff', border:'rgba(0,180,255,0.45)' },
      Purple: { primary:'#b266ff', glow:'#7700ff', border:'rgba(170,100,255,0.5)' },
      Green: { primary:'#55dd88', glow:'#22aa44', border:'rgba(80,220,120,0.5)' }
    };

    let currentCategory = 'combat', expandedModule = null;
    let isDragging = false, hasMoved = false, dragStartX, dragStartY, btnStartX, btnStartY;
    const mainGui = document.getElementById('mainGui');
    const minimizedBtn = document.getElementById('minimizedBtn');
    const root = document.documentElement;

    function applyAccent(color) { root.style.setProperty('--primary',color); root.style.setProperty('--accent',color); root.style.setProperty('--primary-glow',color+'cc'); }
    function applyTheme(name) { const t=themeColors[name]; if(t){ root.style.setProperty('--primary',t.primary); root.style.setProperty('--primary-glow',t.glow); root.style.setProperty('--border',t.border); root.style.setProperty('--accent',t.primary); } }

    function showMinimized(){ minimizedBtn.classList.add('show'); }
    function hideMinimized(){ minimizedBtn.classList.remove('show'); }
    function hideGUI(){ mainGui.classList.add('gui-hidden'); showMinimized(); }
    function showGUI(){ mainGui.classList.remove('gui-hidden'); hideMinimized(); }

    minimizedBtn.addEventListener('pointerdown', function(e){
      isDragging=true; hasMoved=false; dragStartX=e.clientX; dragStartY=e.clientY;
      const rect=minimizedBtn.getBoundingClientRect(); btnStartX=rect.left; btnStartY=rect.top;
      minimizedBtn.style.transition='none'; minimizedBtn.setPointerCapture(e.pointerId);
    });
    minimizedBtn.addEventListener('pointermove', function(e){
      if(!isDragging) return;
      const dx=e.clientX-dragStartX, dy=e.clientY-dragStartY;
      if(Math.abs(dx)>2||Math.abs(dy)>2) hasMoved=true;
      minimizedBtn.style.left=(btnStartX+dx)+'px'; minimizedBtn.style.top=(btnStartY+dy)+'px';
      minimizedBtn.style.right='auto'; minimizedBtn.style.bottom='auto';
    });
    minimizedBtn.addEventListener('pointerup', function(e){
      if(!isDragging) return; isDragging=false;
      minimizedBtn.style.transition='transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease';
      if(!hasMoved) showGUI();
    });
    minimizedBtn.addEventListener('pointercancel', function(){ isDragging=false; minimizedBtn.style.transition='transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease'; });

    document.getElementById('minimizeBtn').addEventListener('click',(e)=>{e.stopPropagation(); hideGUI();});
    document.getElementById('closeBtn').addEventListener('click',(e)=>{e.stopPropagation(); hideGUI();});
    document.addEventListener('keydown',function(e){ if(e.key==='VolumeUp'||e.keyCode===175){e.preventDefault(); showGUI();} });

    function createInlineConfig(module, card) {
      const existing = card.nextElementSibling;
      if (existing && existing.classList.contains('module-config-inline')) {
        existing.style.animation = 'fadeSlide 0.2s ease reverse';
        setTimeout(() => { existing.remove(); card.classList.remove('expanded'); }, 180);
        if (expandedModule === module) expandedModule = null;
        return;
      }
      if (expandedModule && expandedModule !== module) {
        const prev = document.querySelector('.module-card.expanded');
        if (prev) { prev.classList.remove('expanded'); const pc=prev.nextElementSibling; if(pc&&pc.classList.contains('module-config-inline')){pc.style.animation='fadeSlide 0.2s ease reverse'; setTimeout(()=>pc.remove(),180); } }
      }
      const div = document.createElement('div'); div.className = 'module-config-inline'; let h = '';
      if (module.isColor) {
        h += `<div class="config-row"><label>颜色</label><div class="color-options" data-key="color">`;
        presetColors.forEach(c => { h += `<span class="color-dot${module.config.color===c?' active':''}" data-color="${c}" style="background:${c}"></span>`; });
        h += `</div></div>`;
      }
      Object.entries(module.config).forEach(([k, v]) => {
        if (module.isColor && k==='color') return;
        if (k === 'toggle') return;
        if (k.endsWith('Val') && Array.isArray(module.config[k.replace('Val','')])) {
          const mk = k.replace('Val',''); const opts = module.config[mk];
          h += `<div class="config-row"><label>${mk}</label><div class="mode-selector" data-key="${k}">`;
          opts.forEach(o => h += `<span class="mode-option${v===o?' active':''}" data-val="${o}">${o}</span>`);
          h += `</div></div>`;
        } else if (typeof v === 'number') {
          let max=100,step=0.1,min=0;
          if(k==='blur'){max=50;step=1;min=0}else if(k==='opacity'){max=100;step=1;min=10}else if(k==='scale'){max=1.5;min=0.4;step=0.05}else if(k.includes('cps')||k==='cps'){max=20;min=1}else if(k.includes('delay')){max=3000;min=0}else if(k==='dist'||k==='range'||k==='expand'||k==='blockReach'){max=8;min=0}else if(k==='gamma'){max=20;min=1}else if(k==='health'){max=20;min=1}else if(k==='speed'||k==='multiplier'){max=5;min=0.1}else if(k==='boost'){max=5;min=0.5}else if(k==='height'){max=10;min=1}else if(k==='depth'||k==='maxDist'){max=256;min=1}else if(k==='thickness'||k==='width'){max=5;min=0.1}else if(k==='maxPackets'){max=200;min=5}else if(k==='minFall'){max=20;min=2}else if(k==='fov'){max=360;min=10}else if(k==='smooth'){max=10;min=1}else if(k==='size'){max=150;min=30}else if(k==='maxFriends'){max=200;min=10}else if(k==='maxRange'){max=10;min=1}
          h += `<div class="config-row"><label>${k}</label><input type="range" min="${min}" max="${max}" step="${step}" value="${v}" data-key="${k}" data-type="number"><span>${v}</span></div>`;
        }
      });
      div.innerHTML = h; card.after(div); card.classList.add('expanded'); expandedModule = module;
      div.querySelectorAll('.color-dot').forEach(d => { d.addEventListener('click', e => { e.stopPropagation(); const c=d.getAttribute('data-color'); module.config.color=c; div.querySelectorAll('.color-dot').forEach(x=>x.classList.remove('active')); d.classList.add('active'); applyAccent(c); }); });
      div.querySelectorAll('.mode-option').forEach(o => { o.addEventListener('click', e => { e.stopPropagation(); const key=o.parentElement.getAttribute('data-key'); const val=o.getAttribute('data-val'); module.config[key]=val; o.parentElement.querySelectorAll('.mode-option').forEach(x=>x.classList.remove('active')); o.classList.add('active'); if(module.name==='Theme') applyTheme(val); if(module.isFont) applyFont(val); }); });
      div.querySelectorAll('input').forEach(inp => { inp.addEventListener('input', e => { e.stopPropagation(); const key=inp.getAttribute('data-key'); const type=inp.getAttribute('data-type'); if(type==='number'){ const val=parseFloat(inp.value); module.config[key]=val; inp.nextElementSibling.textContent=val; if(module.name==='Blur') root.style.setProperty('--blur-amount',val+'px'); if(module.name==='Opacity') root.style.setProperty('--panel-opacity',val/100); if(module.name==='Scale') root.style.setProperty('--gui-scale',val); } }); });
    }

    function renderCategories() {
      const panel = document.getElementById('categoryPanel'); panel.innerHTML = '';
      Object.keys(modulesData).forEach(cat => {
        const d = document.createElement('div'); d.className = `category-item ${cat===currentCategory?'active':''}`;
        d.innerHTML = `<i>${categoryNames[cat]?.split(' ')[0]}</i> ${cat}`;
        d.addEventListener('click', () => { panel.querySelectorAll('.category-item').forEach(el=>el.classList.remove('active')); d.classList.add('active'); currentCategory=cat; expandedModule=null; renderModules(cat); });
        panel.appendChild(d);
      });
    }

    function renderModules(cat) {
      const mods = modulesData[cat] || [];
      document.getElementById('currentCategoryTitle').textContent = categoryNames[cat] || cat;
      const grid = document.getElementById('moduleGrid'); grid.innerHTML = ''; expandedModule = null;
      mods.forEach((mod, idx) => {
        const card = document.createElement('div'); card.className = 'module-card';
        card.innerHTML = `<div class="module-info"><div class="module-name">🔹 ${mod.name}</div><div class="module-desc">${mod.desc}</div></div><div class="toggle-switch"><input type="checkbox" id="sw-${cat}-${idx}" ${mod.enabled?'checked':''}><label class="slider" for="sw-${cat}-${idx}"></label></div>`;
        const cb = card.querySelector('input');
        cb.addEventListener('change', e => { 
          e.stopPropagation(); 
          mod.enabled = cb.checked;
          playToggleSound();
          showNotification(mod.enabled ? `${mod.name} 已开启` : `${mod.name} 已关闭`);
          // HUD开关控制
          if (mod.name === 'HUD') {
            hudEnabled = cb.checked;
          }
          if (mod.name === 'Notifications') {
            notificationsEnabled = cb.checked;
          }
          updateHUD();
        });
        cb.addEventListener('click', e => e.stopPropagation());
        card.addEventListener('click', e => { if(e.target.closest('.toggle-switch')) return; createInlineConfig(mod, card); });
        grid.appendChild(card);
      });
    }

    minimizedBtn.style.right = '20px'; minimizedBtn.style.bottom = '20px';
    renderCategories(); renderModules('combat'); updateHUD();
  })();
</script>
